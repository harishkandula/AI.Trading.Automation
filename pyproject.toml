[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-ai"
version = "0.2.0"
description = "Lambda-first Indian equity research, backtesting, and paper-trading platform"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "freezegun>=1.5",
    "factory-boy>=3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["I001"]
select = ["E", "F", "W", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
